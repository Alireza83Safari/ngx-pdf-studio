# CI (§14A): every gate the repo enforces locally, on every push/PR —
# lint, format, typecheck, the full Jest suite with the coverage gate,
# the core dist build, and the consumer tarball smoke test.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Audit the tree of the publishable package (its runtime deps). The
      # Angular toolchain at the root is dev/peer-only — consumers bring their
      # own Angular version — so it is gated separately, not here.
      - run: npm audit --omit=dev --audit-level=high -w @ngx-pdf-studio/core
      - run: npx eslint "packages/**/*.ts"
      - run: npx prettier --check "packages/**/*.{ts,md,json}" "*.{json,js,md}" "docs/**/*.md"
      - run: npx tsc -p packages/pdf-studio/core/tsconfig.lib.json --noEmit
      - run: npx jest --coverage
      - run: npm run build:core
      - run: npm run build:angular
      - run: npm run smoke:tarball

  # The designer and the docs page, in their own job because both need the
  # esbuild bundle and neither belongs in the Node matrix — they exercise a
  # browser, and the browser does not vary with the Node version.
  #
  # These two ran only on someone's laptop until now, which made the designer —
  # the flagship surface of this repo, and its largest single file — the one
  # part of the product no gate defended. `npx jest` covers the designer's
  # extracted pure logic; `smoke.js` is what covers the shell it lives in.
  designer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run designer:smoke
      # The docs page is self-contained and loads nothing over the network, so
      # jsdom can run the real thing: translations, links, and the code samples
      # it tells people to copy.
      - run: npm run smoke:docs

  # The render service (designer-ux 5.3), in its own job because it needs the
  # built dist and Docker, and neither should slow the main gate down.
  #
  # Two layers, failing for different reasons: the e2e installs the packed
  # tarball and talks HTTP to the server — proving the service works against the
  # artifact consumers get — while the Docker build proves the image that ships
  # it is buildable and its own healthcheck passes.
  render-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run smoke:render-service
      - run: docker build -f apps/render-service/Dockerfile -t pdfstudio/render .
      - name: The container serves a PDF
        run: |
          docker run -d --name render -p 3000:3000 pdfstudio/render
          # Wait for the healthcheck the image declares, rather than sleeping a
          # guessed interval and calling a slow start a failure.
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' render 2>/dev/null || echo starting)
            [ "$state" = "healthy" ] && break
            sleep 2
          done
          if [ "$(docker inspect -f '{{.State.Health.Status}}' render)" != "healthy" ]; then
            echo "::error::the container never became healthy"
            docker logs render
            exit 1
          fi
          curl -sS -X POST localhost:3000/render \
            -H 'content-type: application/json' \
            -d @tools/fixtures/render-request.json -o out.pdf -w '%{http_code}' > code.txt
          test "$(cat code.txt)" = "200" || { echo "::error::expected 200, got $(cat code.txt)"; cat out.pdf; exit 1; }
          # A 200 with an HTML error page would pass a status check; insist on
          # the magic bytes and a plausible size.
          head -c 5 out.pdf | grep -q '%PDF-' || { echo "::error::response is not a PDF"; exit 1; }
          test "$(stat -c%s out.pdf)" -gt 2000 || { echo "::error::PDF is suspiciously small"; exit 1; }
          docker rm -f render

  # Compatibility of the built packages against every supported Angular major
  # (§2.1), in two layers that fail for different reasons:
  #
  #  1. the **linker** actually rejects a library published by a newer Angular,
  #     which is what decides the supported floor;
  #  2. the **type** check catches public-API breakage against each major's
  #     TypeScript.
  #
  # The type check alone is not enough: `.d.ts` files carry no Angular version,
  # so it passes even for majors that cannot build the package at all.
  angular-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        angular-version: ['14', '17', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tools/smoke-angular-linker.mjs ${{ matrix.angular-version }}
      - run: node tools/smoke-angular-consumer.mjs ${{ matrix.angular-version }}

  # The floor is a claim, so prove it from below too: Angular 13 must fail to
  # link. If a future ng-packagr lowers `minVersion` and this job starts
  # passing, the supported range widened and the docs/peer range should follow.
  angular-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:angular
      - name: Angular 13 must reject the published bundle
        run: |
          if node tools/smoke-angular-linker.mjs 13 > floor.log 2>&1; then
            echo "::error::Angular 13 linked the bundle — the floor is lower than 14, update peerDependencies and the docs"
            exit 1
          fi
          # Insist on the *right* failure: a broken install or a bad probe also
          # exits nonzero, and would otherwise read as proof of the floor.
          if ! grep -q "requires Angular version" floor.log; then
            echo "::error::Angular 13 failed, but not with the linker's version diagnostic — the probe is broken, not the claim"
            cat floor.log
            exit 1
          fi
          echo "Angular 13 rejects the bundle with the expected linker diagnostic."
